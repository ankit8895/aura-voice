name: CI and Deploy to EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Bootstrap and deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,DEPLOY_DOMAIN,APP_ENV_FILE
          script: |
            set -euo pipefail

            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get install -y git
            fi

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
            fi

            sudo mkdir -p /opt/aura-voice
            sudo chown -R "$USER:$USER" /opt/aura-voice

            if [ ! -d /opt/aura-voice/.git ]; then
              git clone https://github.com/ankit8895/aura-voice.git /opt/aura-voice
            fi

            cd /opt/aura-voice
            git fetch origin main
            git reset --hard origin/main

            printf '%s\n' "$APP_ENV_FILE" > .env.production
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .env.production
            chmod 600 .env.production

            sudo docker compose up -d --build app

            if ! sudo docker volume inspect aura-voice_certbot-etc >/dev/null 2>&1; then
              cp nginx/bootstrap.conf nginx/default.conf

              sudo docker compose up -d nginx

              sudo docker compose run --rm certbot certonly \
                --webroot \
                --webroot-path /var/www/certbot \
                --domain "$DEPLOY_DOMAIN" \
                --email "$CERTBOT_EMAIL" \
                --agree-tos \
                --no-eff-email

              git checkout -- nginx/default.conf
              sudo docker compose up -d --force-recreate nginx
            fi

            sudo docker compose up -d --build --remove-orphans

            sudo docker compose exec -T app npx prisma migrate deploy

            sudo docker compose exec -T nginx nginx -t
            sudo docker image prune -f
